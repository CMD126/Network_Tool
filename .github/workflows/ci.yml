name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: ShellCheck
        run: shellcheck -S warning networktool.sh lib/*.sh tests/*.sh docs/*.sh
      - name: NSE XML parser tests
        run: python3 -m unittest discover -s tests -p 'test_nse*.py'
      - name: Tests
        run: bats tests/
