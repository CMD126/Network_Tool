name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: ShellCheck
        run: shellcheck -S error networktool.sh lib/*.sh tests/*.sh
      - name: Tests
        run: bats tests/
